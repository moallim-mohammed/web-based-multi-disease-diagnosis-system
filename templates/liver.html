{% extends 'main.html' %}
{% block content %}

<style>
.btn-custom {
    background-color: #a3f63d;
    color: black;
    border: none;
    font-weight: 600;
}

.btn-custom:hover {
    background-color: #8ed62f;
    color: white;
}
</style>

<div class="container my-5">

    <!-- Title -->
    <div class="text-center mb-4">
        <h1 class="fw-bold">Liver Disease Predictor</h1>
        <p class="text-muted">Enter medical details to check liver health</p>
    </div>

    <!-- Form Card -->
    <div class="card shadow-sm border-0 p-4">

        <form action="{{ url_for('predictPage') }}" method="POST">

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label>Age</label>
                    <input class="form-control border-dark" type="number" name="Age" placeholder="Enter age" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Total Bilirubin</label>
                    <input class="form-control border-dark" type="number" step="0.1" name="Total_Bilirubin" placeholder="Enter value" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Direct Bilirubin</label>
                    <input class="form-control border-dark" type="number" step="0.1" name="Direct_Bilirubin" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Alkaline Phosphotase</label>
                    <input class="form-control border-dark" type="number" name="Alkaline_Phosphotase" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Alamine Aminotransferase</label>
                    <input class="form-control border-dark" type="number" name="Alamine_Aminotransferase" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Aspartate Aminotransferase</label>
                    <input class="form-control border-dark" type="number" name="Aspartate_Aminotransferase" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Total Proteins</label>
                    <input class="form-control border-dark" type="number" step="0.1" name="Total_Protiens" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Albumin</label>
                    <input class="form-control border-dark" type="number" step="0.1" name="Albumin" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Albumin & Globulin Ratio</label>
                    <input class="form-control border-dark" type="number" step="0.1" name="Albumin_and_Globulin_Ratio" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Gender</label>
                    <select class="form-control border-dark" name="Gender_Male" required>
                        <option value="">Select</option>
                        <option value="1">Male</option>
                        <option value="0">Female</option>
                    </select>
                </div>

            </div>

            <!-- Submit -->
            <div class="text-center mt-3">
                <button type="submit" class="btn btn-custom px-5">Predict</button>
            </div>

        </form>

    </div>

</div>

{% endblock %}
