{% extends 'main.html' %}
{% block content %}

<div class="container my-5">

    <!-- Title -->
    <div class="text-center mb-4">
        <h1 class="fw-bold">Heart Disease Predictor</h1>
        <p class="text-muted">Enter patient details to predict heart disease risk</p>
    </div>

    <!-- Form Card -->
    <div class="card shadow-sm border-0 p-4">

        <form action="{{ url_for('predictPage') }}" method="POST">

            <div class="row">

                <!-- Age -->
                <div class="col-md-4 mb-3">
                    <label>Age</label>
                    <input class="form-control border-dark" type="number" name="age" placeholder="Enter age" required>
                </div>

                <!-- Sex -->
                <div class="col-md-4 mb-3">
                    <label>Gender</label>
                    <select class="form-control border-dark" name="sex" required>
                        <option value="">Select</option>
                        <option value="1">Male</option>
                        <option value="0">Female</option>
                    </select>
                </div>

                <!-- Chest Pain -->
                <div class="col-md-4 mb-3">
                    <label>Chest Pain Type</label>
                    <input class="form-control border-dark" type="number" name="cp" placeholder="0–3" required>
                </div>

                <!-- BP -->
                <div class="col-md-4 mb-3">
                    <label>Resting Blood Pressure</label>
                    <input class="form-control border-dark" type="number" name="trestbps" placeholder="mm Hg" required>
                </div>

                <!-- Cholesterol -->
                <div class="col-md-4 mb-3">
                    <label>Cholesterol</label>
                    <input class="form-control border-dark" type="number" name="chol" placeholder="mg/dl" required>
                </div>

                <!-- FBS -->
                <div class="col-md-4 mb-3">
                    <label>Fasting Blood Sugar</label>
                    <select class="form-control border-dark" name="fbs" required>
                        <option value="">Select</option>
                        <option value="1">> 120 mg/dl</option>
                        <option value="0">≤ 120 mg/dl</option>
                    </select>
                </div>

                <!-- ECG -->
                <div class="col-md-4 mb-3">
                    <label>Resting ECG</label>
                    <input class="form-control border-dark" type="number" name="restecg" placeholder="0–2" required>
                </div>

                <!-- Heart Rate -->
                <div class="col-md-4 mb-3">
                    <label>Max Heart Rate</label>
                    <input class="form-control border-dark" type="number" name="thalach" placeholder="Enter value" required>
                </div>

                <!-- Angina -->
                <div class="col-md-4 mb-3">
                    <label>Exercise Induced Angina</label>
                    <select class="form-control border-dark" name="exang" required>
                        <option value="">Select</option>
                        <option value="1">Yes</option>
                        <option value="0">No</option>
                    </select>
                </div>

                <!-- Oldpeak -->
                <div class="col-md-4 mb-3">
                    <label>Oldpeak</label>
                    <input class="form-control border-dark" type="number" step="0.1" name="oldpeak" placeholder="ST depression" required>
                </div>

                <!-- Slope -->
                <div class="col-md-4 mb-3">
                    <label>Slope</label>
                    <input class="form-control border-dark" type="number" name="slope" placeholder="0–2" required>
                </div>

                <!-- CA -->
                <div class="col-md-4 mb-3">
                    <label>Major Vessels (CA)</label>
                    <input class="form-control border-dark" type="number" name="ca" placeholder="0–3" required>
                </div>

                <!-- Thal -->
                <div class="col-md-6 mx-auto mb-3">
                    <label>Thal</label>
                    <select class="form-control border-dark" name="thal" required>
                        <option value="">Select</option>
                        <option value="3">Normal</option>
                        <option value="6">Fixed Defect</option>
                        <option value="7">Reversible Defect</option>
                    </select>
                </div>

            </div>

            <!-- Button -->
            <div class="text-center mt-3">
            <button type="submit" class="btn px-5" style="background-color:#a3f63d; color:black; border:none;">
                        Predict
            </button>           
             </div>

        </form>

    </div>

</div>

{% endblock %}
